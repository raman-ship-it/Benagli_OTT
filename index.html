:root{--bg:#f5f6f8;--card:#fff;--tx:#122038;--mu:#667489;--bd:#e3e7ee;--nav:#0a1a33;--teal:#0f7c86;--navy:#14305c;--gold:#b8892b;--goldbg:#faf5e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1322;--card:#121e33;--tx:#e8eef7;--mu:#9aabc2;--bd:#26364f;--goldbg:#262212;--navy:#8fb2e6}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100%}
nav{width:262px;background:var(--nav);color:#c5d4ea;flex:none;height:100vh;position:sticky;top:0;overflow:auto;padding:20px 0}
nav h1{font:600 16px/1.25 Georgia,serif;margin:0 20px 2px;color:#fff}nav small{display:block;margin:0 20px 14px;color:#7f98bd;font-size:11px}
nav a{display:block;padding:6px 20px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;color:#b9cae4}nav a:hover{color:#fff}nav a.on{color:#fff;border-color:var(--gold);background:rgba(255,255,255,.06)}
nav .g{margin:14px 20px 3px;font-size:10px;letter-spacing:.12em;color:#6f8ab2;text-transform:uppercase}
main{flex:1;min-width:0;padding:0 34px 50px;max-width:1240px}
.fb{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;background:var(--bg)}
.fb label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);display:flex;flex-direction:column;gap:2px}select,button{font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--bd);border-radius:2px;background:var(--card);color:var(--tx)}button{cursor:pointer;background:var(--navy);color:#fff;border:0;padding:5px 10px}button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.nb{margin-left:auto;font-size:11px;color:var(--mu)}.warn{color:#b45309;font-weight:600}
.kick{margin-top:26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:600}
h2{font:400 15px/1.3 system-ui,sans-serif;color:var(--mu);margin:2px 0 6px}
.hl{font:600 27px/1.25 Georgia,"Times New Roman",serif;color:var(--navy);margin:0 0 10px;max-width:900px}
.sn{max-width:860px;font-size:15px;margin:0 0 16px;color:var(--tx)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:2px solid var(--navy);border-bottom:1px solid var(--bd);background:var(--card);margin:6px 0 18px}.k{padding:12px 16px;border-right:1px solid var(--bd)}.k:last-child{border:0}.k span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:600}.k b{display:block;font:600 32px/1.2 Georgia,serif;color:var(--navy);margin:2px 0}.k i{display:block;font-size:12px;color:var(--mu);font-style:normal;line-height:1.35}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:22px 28px}.c{background:var(--card);padding:12px 14px 10px;overflow-x:auto;border-top:1px solid var(--bd)}.c h4{margin:0;font-size:13px;color:var(--tx)}.c .b{font-size:10.5px;color:var(--mu);margin:1px 0 8px}.cv{position:relative;height:270px}
table{border-collapse:collapse;font-size:11.5px;width:100%}th,td{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:center}th{font-weight:600;color:var(--mu)}th:first-child,td:first-child{text-align:left}
.ev{margin:20px 0 4px;padding-left:16px;border-left:3px solid var(--gold);max-width:900px}.ev p{margin:0 0 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px;max-width:1000px}.two h5{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}.two p{margin:0 0 6px}.two ul{margin:4px 0;padding-left:18px}
.fn{font-size:11px;color:var(--mu);margin-top:18px;border-top:1px solid var(--bd);padding-top:8px}.nx{display:block;margin-top:14px;color:var(--navy);cursor:pointer;font-weight:600}
.tag{font-size:10px;padding:1px 6px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.05em;text-transform:uppercase}
@media(max-width:820px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;padding:6px}nav .g,nav small{display:none}nav h1{width:100%;padding-top:6px}nav a{padding:4px 8px;border:0}main{padding:0 14px 40px}.gr,.two{grid-template-columns:1fr}.hl{font-size:22px}}

<p class="sn">${cap(W(share('lang',['Bengali'],ALL)))} of those screened prefer Bengali OTT content, and viewers are regular, mobile-first and drawn to ${lc(T('reason'))}. The commercial opportunity lies in exclusive ${T('miss').toLowerCase()}, ${T('miss',1).toLowerCase()} and ${T('miss',2).toLowerCase()} content, while payment intent remains concentrated at entry price points. Findings describe the surveyed sample, not the whole market.</p>
${kh([K('Weekly Bengali viewers','freq',WK,'Habitual regional audience'),K('Smartphone first','dev',['Smartphone'],'Mobile-led consumption'),K('Lead platform reach','plat',[T('plat')],T('plat')+' within this audience'),K('Name a monthly price','wtp',NP,'Conditional willingness to pay')])}
<div class="gr">${[{t:'Platforms used',k:'plat',ty:'hbar'},{t:'Content formats watched',k:'ctype',ty:'hbar'},{t:'Genres viewers want more of',k:'miss',ty:'hbar',max:6}].map(chartHTML).join('')}</div>
<div class="two" style="max-width:none"><div><h5>Five audience insights</h5><ul><li>Bengali is a preferred viewing language, and viewing is habitual rather than occasional.</li><li>The audience is young and smartphone-first, with many viewers outside metro cities.</li><li>${T('plat')} leads platform reach; ${T('plat',1)} follows, and challengers have little visibility.</li><li>${T('ctype')} lead consumption, and recall concentrates on a few flagship titles.</li><li>${T('disc')} is the main discovery route, ahead of traditional advertising.</li></ul></div>
<div><h5>Three content opportunities</h5><ul><li>${T('miss')} and ${T('miss',2).toLowerCase()} originals</li><li>${T('miss',1)} as a complementary genre</li><li>Classic Bengali films as a niche catalogue extension</li></ul><h5 style="margin-top:12px">Three strategic implications</h5><ul><li>Exclusive originals are the strongest subscription lever.</li><li>Value for money is the main retention risk.</li><li>Challenger platforms need awareness before promotion.</li></ul></div></div>`}
